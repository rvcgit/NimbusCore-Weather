[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=Weather Dusk Engine Master (Icon Code Variant)
Version=8.2
Information=Stable skin with split-measure wind logic and icon codes.

[Variables]
CacheFolder=#SETTINGSPATH#..\..\..\AppData\Local\Temp\WeatherCache
CustomFont=JetBrainsMono NF
SkinWidth=520
SkinHeight=280
ClickThrough=1
AlwaysOnTop=-2
DragMargins=0,0,0,0
; Custom Tooltip Styling Settings
TooltipBGColor=0,0,128,240
TooltipTextColor=255,234,0,255
ToolTipBorderColor=255,215,0,255
TooltipFontSize=11


; ====================================================
; DATA EXTRACTION ENGINE
; ====================================================

[MeasureJsonParent]
Measure=WebParser
Url=file://#CacheFolder#\weather_api_cache.json
RegExp=(?s)"current":\s*\{.*?"temperature_2m":\s*([\d\.-]+).*?"apparent_temperature":\s*([\d\.-]+).*?"wind_speed_10m":\s*([\d\.-]+).*?"wind_direction_10m":\s*([\d\.-]+).*?"is_day":\s*(\d+).*?"weather_code":\s*(\d+)
UpdateRate=30

[MeasureTemp]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=1

[MeasureApparentTemp]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=2

[MeasureWindSpeed]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=3

[MeasureWindAngle]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=4

[MeasureIsDay]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=5

[MeasureConditionCode]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=6

[MeasureForecastRaw]
Measure=WebParser
Url=file://#CacheFolder#\weather_forecast_cache
RegExp=(?s)(.*)
UpdateRate=30

[MeasureMoonRaw]
Measure=WebParser
Url=file://#CacheFolder#\weather_moon_phase_cache
RegExp=(?s)(.*)
UpdateRate=30
; STRIPS HIDDEN NEWLINES: Cleans up the string completely
RegExpSubstitute=1
Substitute="\r":"","\n":"","^\s+":"","\s+$":""

[MeasureMoonIcon]
Measure=String
String=[MeasureMoonRaw]
RegExpSubstitute=1
; UNIVERSAL WEATHER ICON SECTOR MAP (Supported by all Nerd Fonts):
Substitute="^$":" ","(?i)^.*New Moon.*$":"[\xe393]","(?i)^.*Waxing Crescent.*$":"[\xe394]","(?i)^.*First Quarter.*$":"[\xe397]","(?i)^.*Waxing Gibbous.*$":"[\xe399]","(?i)^.*Full Moon.*$":"[\xe39b]","(?i)^.*Waning Gibbous.*$":"[\xe39c]","(?i)^.*Last Quarter.*$":"[\xE39E]","(?i)^.*Waning Crescent.*$":"[\xE3A0]"
DynamicVariables=1

; --- NEW AQI ENGINE (CONTRAST TUNED FOR LIGHT CLOUD BACKGROUND) ---

[MeasureAQIRawParent]
Measure=WebParser
Url=file://#CacheFolder#\air_aqi_cache
RegExp=(?s)(.*)
UpdateRate=30

[MeasureAQIRaw]
Measure=WebParser
URL=[MeasureAQIRawParent]
StringIndex=1
RegExpSubstitute=1
Substitute="\r":"","\n":""

[MeasureAQIEval]
Measure=Calc
Formula=MeasureAQIRaw
IfCondition=(MeasureAQIEval > 0) && (MeasureAQIEval <= 50)
IfTrueAction=[!SetOption MeterAQIDisplay Text "[\x25c9] AQI : [MeasureAQIRaw] (Good)"][!SetOption MeterAQIDisplay FontColor "136,175,102,255"][!UpdateMeter MeterAQIDisplay][!Redraw]
IfCondition2=(MeasureAQIEval > 50) && (MeasureAQIEval <= 100)
IfTrueAction2=[!SetOption MeterAQIDisplay Text "[\x224b] AQI : [MeasureAQIRaw] (Moderate)"][!SetOption MeterAQIDisplay FontColor "200,140,0,255"][!UpdateMeter MeterAQIDisplay][!Redraw]
IfCondition3=(MeasureAQIEval > 100) && (MeasureAQIEval <= 150)
IfTrueAction3=[!SetOption MeterAQIDisplay Text "[\x2668] AQI : [MeasureAQIRaw] (Unhealthy for Sensitive Groups)"][!SetOption MeterAQIDisplay FontColor "215,95,0,255"][!UpdateMeter MeterAQIDisplay][!Redraw]
IfCondition4=(MeasureAQIEval > 150) && (MeasureAQIEval <= 200)
IfTrueAction4=[!SetOption MeterAQIDisplay Text "[\x2623] AQI : [MeasureAQIRaw] (Unhealthy)"][!SetOption MeterAQIDisplay FontColor "196,56,40,255"][!UpdateMeter MeterAQIDisplay][!Redraw]
IfCondition5=(MeasureAQIEval > 200) && (MeasureAQIEval <= 300)
IfTrueAction5=[!SetOption MeterAQIDisplay Text "[\x2623] AQI : [MeasureAQIRaw] (Very Unhealthy)"][!SetOption MeterAQIDisplay FontColor "125,45,133,255"][!UpdateMeter MeterAQIDisplay][!Redraw]
IfCondition6=(MeasureAQIEval > 300)
IfTrueAction6=[!SetOption MeterAQIDisplay Text "[\x2623] AQI : [MeasureAQIRaw] (Hazardous)"][!SetOption MeterAQIDisplay FontColor "110,20,30,255"][!UpdateMeter MeterAQIDisplay][!Redraw]
DynamicVariables=1

; ====================================================
; TRANSLATORS & VALUE MAPS
; ====================================================

[MeasureFormatTemp]
Measure=String
String=[MeasureTemp]
RegExpSubstitute=1
Substitute="^(-?\d+)\.\d+$":"\1[\x00b0]C","^(-?\d+)$":"\1[\x00b0]C","^$":"--[\x00b0]C"
DynamicVariables=1

[MeasureFormatApparentTemp]
Measure=String
String=[MeasureApparentTemp]
RegExpSubstitute=1
Substitute="^(-?\d+)\.\d+$":"\1[\x00b0]C","^(-?\d+)$":"\1[\x00b0]C","^$":"--[\x00b0]C"
DynamicVariables=1

[MeasureIconKey]
Measure=Calc
Formula=([MeasureConditionCode] * 10 + [MeasureIsDay])
DynamicVariables=1

[MeasureWeatherIcon]
Measure=String
String=[MeasureIconKey]
RegExpSubstitute=1
; EXPLICIT NON-OVERLAPPING WEATHER MATRIX: COVERS EVERY VALID OPEN-METEO STATE SAFELY
Substitute="^0$":"[\xf186]","^1$":"[\xe30d]","^2$":"[\xf186]","^3$":"[\xe30c]","^10$":"[\xe37e]","^11$":"[\xe21d]","^20$":"[\xe37e]","^21$":"[\xe30d]","^30$":"[\xe30c]","^31$":"[\xe30c]","^450$":"[\xe313]","^451$":"[\xe313]","^480$":"[\xe313]","^481$":"[\xe313]","^510$":"[\xe318]","^511$":"[\xe318]","^530$":"[\xe318]","^531$":"[\xe318]","^550$":"[\xe318]","^551$":"[\xe318]","^560$":"[\xe318]","^561$":"[\xe318]","^570$":"[\xe318]","^571$":"[\xe318]","^610$":"[\xe318]","^611$":"[\xe318]","^630$":"[\xe318]","^631$":"[\xe318]","^650$":"[\xe318]","^651$":"[\xe318]","^660$":"[\xe318]","^661$":"[\xe318]","^670$":"[\xe318]","^671$":"[\xe318]","^800$":"[\xe318]","^801$":"[\xe318]","^810$":"[\xe318]","^811$":"[\xe318]","^820$":"[\xe318]","^821$":"[\xe318]","^710$":"[\xf2dc]","^711$":"[\xf2dc]","^730$":"[\xf2dc]","^731$":"[\xf2dc]","^750$":"[\xf2dc]","^751$":"[\xf2dc]","^770$":"[\xf2dc]","^771$":"[\xf2dc]","^850$":"[\xf2dc]","^851$":"[\xf2dc]","^860$":"[\xf2dc]","^861$":"[\xf2dc]","^950$":"[\xe322]","^951$":"[\xe322]","^960$":"[\xe322]","^961$":"[\xe322]","^990$":"[\xe322]","^991$":"[\xe322]"
DynamicVariables=1

[MeasureWindIndex] 
Measure=Calc
Formula=Floor(([MeasureWindAngle] + 11.25) / 22.5) % 16
DynamicVariables=1

[MeasureWindDirectionString]
Measure=String
String=[MeasureWindIndex:]
RegExpSubstitute=1
Substitute="^10$":"[\x2197] SW","^11$":"[\x2197] WSW","^12$":"[\x2192] W","^13$":"[\x2198] WNW","^14$":"[\x2198] NW","^15$":"[\x2198] NNW","^0$":"[\x2193] N","^1$":"[\x2199] NNE","^2$":"[\x2199] NE","^3$":"[\x2199] ENE","^4$":"[\x2190] E","^5$":"[\x2196] ESE","^6$":"[\x2196] SE","^7$":"[\x2196] SSE","^8$":"[\x2193] S","^9$":"[\x2197] SSW"
DynamicVariables=1

; ====================================================
; VISUAL INTERFACE
; ====================================================

[MeterBackground]
Meter=Shape
W=500
H=280
MyCloudGradient=LinearGradient 90 | #ColorSkyBlue# ; 0.3 | #ColorCloudWhite# ; 0.5 | #ColorWarmGlow# ; 0.8 | #ColorShadowGray# ; 1.0
Shape=Ellipse 160, 95, 140, 75 | StrokeWidth 0
Shape2=Ellipse 270, 95, 108, 75 | StrokeWidth 0
Shape3=Ellipse 320, 95, 96, 75 | StrokeWidth 0
Shape4=Ellipse 380, 115, 78, 55 | StrokeWidth 0
Shape5=Combine Shape | Union Shape | Union Shape2 | Union Shape3 | Union Shape4
Shape6=Path Shape5 | Fill Fill MyCloudGradient | StrokeWidth 0

[MeterIconDisplay]
Meter=String
MeasureName=MeasureWeatherIcon
X=120
Y=30
StringAlign=Right
FontFace=#CustomFont#
FontColor=([MeasureIsDay] = 1 ? 204 : 150),([MeasureIsDay] = 1 ? 93 : 170),([MeasureIsDay] = 1 ? 76 : 220),255
FontSize=32
AntiAlias=1
Text=%1
;ToolTipType=1
;ToolTipTitle=[\xEA62] EXTENDED FORECAST SUMMARY
MouseOverAction=[!ShowMeterGroup "CustomTooltipGroup"][!Redraw]
MouseLeaveAction=[!HideMeterGroup "CustomTooltipGroup"][!Redraw]
;ToolTipText=[MeasureForecastRaw]
DynamicVariables=1

[MeterTempDisplay]
Meter=String
MeasureName=MeasureFormatTemp
X=140
Y=42
FontFace=#CustomFont#
FontColor=148, 118, 92,255
FontSize=24
FontWeight=700
AntiAlias=1
Text=%1
;ToolTipType=1
;ToolTipTitle=[\xEA62] EXTENDED FORECAST SUMMARY
MouseOverAction=[!ShowMeterGroup "CustomTooltipGroup"][!Redraw]
MouseLeaveAction=[!HideMeterGroup "CustomTooltipGroup"][!Redraw]
;ToolTipText=[MeasureForecastRaw]
DynamicVariables=1

[MeterApparentTempDisplay]
Meter=String
MeasureName=MeasureFormatApparentTemp
X=3R
Y=18r
FontFace=#CustomFont#
FontColor=230, 153, 0,255
FontSize=10
FontWeight=700
AntiAlias=1
Text="[Feels like %1]"
DynamicVariables=1

[MeterWindDisplay]
Meter=String
MeasureName=MeasureWindDirectionString
MeasureName2=MeasureWindSpeed
X=240
Y=80
StringAlign=Center
FontFace=#CustomFont#
FontColor=1,87,155,255
FontSize=11
FontWeight=500
AntiAlias=1
Text=" Wind [\xef16] From %1 @ %2 m/s "
DynamicVariables=1

[MeterMoonDisplay]
Meter=String
MeasureName=MeasureMoonIcon
MeasureName2=MeasureMoonRaw
X=235
Y=120
StringAlign=Center
FontFace=#CustomFont#
FontColor=([MeasureIsDay] = 1 ? 69 : 121),([MeasureIsDay] = 1 ? 90 : 134),([MeasureIsDay] = 1 ? 100 : 203),255
FontSize=14
FontWeight=500
AntiAlias=1
ClipString=1
W=(#SkinWidth# - 60)
Text="%1 %2"
DynamicVariables=1

[MeterAQIDisplay]
Meter=String
X=235
Y=103
StringAlign=Center
FontFace=#CustomFont#
FontSize=10
FontWeight=300
AntiAlias=1
ClipString=1
W=(#SkinWidth# - 160)
Text="[x2623] AQI:Fetching..."
DynamicVariables=1

; --------------------------------------------
; REPLACE THE PREVIOUS CUSTOM TOOLTIP CODE WITH THIS:
; --------------------------------------------

[MeterCustomTooltipBG]
Meter=Shape
; Width expanded to 380 for maximum breathing room
Shape=Rectangle 0,0,380,([MeterCustomTooltipBody:H] + 55),6 | Fill Color #TooltipBGColor# | Stroke Width 2 | Stroke #TooltipBorderColor#
DynamicVariables=1
X=0
Y=65
Group=CustomTooltipGroup
Hidden=1

[MeterCustomTooltipTitle]
Meter=String
Text=[\xf073] EXTENDED FORECAST SUMMARY
FontColor=#TooltipTextColor#
FontSize=#TooltipFontSize#
FontWeight=700
FontFace=JetBrainsMono Nerd Font
AntiAlias=1
X=12
Y=75
Group=CustomTooltipGroup
Hidden=1

[MeterCustomTooltipBody]
Meter=String
MeasureName=MeasureForecastRaw
FontColor=#TooltipTextColor#
FontSize=9.5
FontFace=JetBrainsMono Nerd Font
AntiAlias=1
; Text container expanded to 356 to stop text from wrapping awkwardly
W=356
ClipString=1
X=12
Y=25r
Group=CustomTooltipGroup
Hidden=1
