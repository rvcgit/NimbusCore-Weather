[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=Weather Dusk Engine Master
Version=8.1
Information=Stable skin with is_day-aware current weather icons.

[Variables]
CacheFolder=#SETTINGSPATH#..\..\..\AppData\Local\Temp\WeatherCache
CustomFont=FiraMono Nerd Font
SkinWidth=520
SkinHeight=120
ClickThrough=1
AlwaysOnTop=-2
DragMargins=0,0,0,0

; ====================================================
; DATA EXTRACTION ENGINE
; ====================================================

[MeasureJsonParent]
Measure=WebParser
Url=file://#CacheFolder#\weather_api_cache.json
RegExp=(?s)"current":\s*\{.*?"temperature_2m":\s*([\d\.-]+).*?"wind_speed_10m":\s*([\d\.-]+).*?"wind_direction_10m":\s*([\d\.-]+).*?"is_day":\s*(\d+).*?"weather_code":\s*(\d+)
UpdateRate=30

[MeasureTemp]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=1

[MeasureWindSpeed]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=2

[MeasureWindAngle]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=3

; Capture 4 = is_day (1 daytime, 0 nighttime).
[MeasureIsDay]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=4

; Capture 5 = weather_code.
[MeasureConditionCode]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=5

[MeasureForecastRaw]
Measure=WebParser
Url=file://#CacheFolder#\weather_forecast_cache
RegExp=(?s)(.*)
UpdateRate=30

[MeasureMoonRaw]
Measure=WebParser
Url=file://#CacheFolder#\weather_moon_phase_cache
RegExp=(?s)(.*)
UpdateRate=30

; ====================================================
; TRANSLATORS & VALUE MAPS
; ====================================================

[MeasureFormatTemp]
Measure=String
String=[MeasureTemp]
RegExpSubstitute=1
; Safely appends a clean degree Celsius symbol using its true hex code (\x00B0)
Substitute="^(\d+)\.\d+$":"\1[\x00B0]C","^(\d+)$":"\1[\x00B0]C","^$":"--[\x00B0]C"
DynamicVariables=1

; Combine weather_code and is_day; only clear/partly cloudy vary by day/night.
[MeasureIconKey]
Measure=Calc
Formula=([MeasureConditionCode] * 10 + [MeasureIsDay])
DynamicVariables=1

[MeasureWeatherIcon]
Measure=String
String=[MeasureIconKey]
RegExpSubstitute=1
Substitute="^0$":"[\xF186]","^1$":"[\xF185]","^10$":"[\xE37E]","^11$":"[\xE21D]","^20$":"[\xE37E]","^21$":"[\xE21D]","^30$":"[\xE312]","^31$":"[\xE312]","^450$":"[\xE30E]","^451$":"[\xE30E]","^480$":"[\xE30E]","^481$":"[\xE30E]","^510$":"[\xE239]","^511$":"[\xE239]","^530$":"[\xE239]","^531$":"[\xE239]","^550$":"[\xE239]","^551$":"[\xE239]","^560$":"[\xE239]","^561$":"[\xE239]","^570$":"[\xE239]","^571$":"[\xE239]","^610$":"[\xE239]","^611$":"[\xE239]","^630$":"[\xE239]","^631$":"[\xE239]","^650$":"[\xE239]","^651$":"[\xE239]","^660$":"[\xE239]","^661$":"[\xE239]","^670$":"[\xE239]","^671$":"[\xE239]","^800$":"[\xE239]","^801$":"[\xE239]","^810$":"[\xE239]","^811$":"[\xE239]","^820$":"[\xE239]","^821$":"[\xE239]","^710$":"[\xF2DC]","^711$":"[\xF2DC]","^730$":"[\xF2DC]","^731$":"[\xF2DC]","^750$":"[\xF2DC]","^751$":"[\xF2DC]","^770$":"[\xF2DC]","^771$":"[\xF2DC]","^850$":"[\xF2DC]","^851$":"[\xF2DC]","^860$":"[\xF2DC]","^861$":"[\xF2DC]","^950$":"[\xE322]","^951$":"[\xE322]","^960$":"[\xE322]","^961$":"[\xE322]","^990$":"[\xE322]","^991$":"[\xE322]","^$":"[\xF185]"
DynamicVariables=1


[MeasureIconColor]
Measure=Calc
Formula=([MeasureIsDay] = 1 ? 139 : 0)
DynamicVariables=1

[MeasureWindDirectionArrow] 
Measure=Calc
Formula=Floor(([MeasureWindAngle] + 11.25) / 22.5) % 16
DynamicVariables=1
; EVERY STANDARD ARROW CONVERTED INTO STABLE NERD FONT HEX CODES:
Substitute="0":"[\x2193] N","1":"[\x2199] NNE","2":"[\x2199] NE","3":"[\x2199] ENE","4":"[\x2190] E","5":"[\x2196] ESE","6":"[\x2196] SE","7":"[\x2196] SSE","8":"[\x2193] S","9":"[\x2197] SSW","10":"[\x2197] SW","11":"[\x2197] WSW","12":"[\x2192] W","13":"[\x2198] WNW","14":"[\x2198] NW","15":"[\x2198] NNW"

[MeasureMoonIcon]
Measure=String
String=[MeasureMoonRaw]
RegExpSubstitute=1
; ESCAPE VALUES STRICTLY KEPT UNDER THE 4-CHARACTER RAINMETER CEILING (USING THE HIGH-COMPATIBILITY WEATHER SUBSET):
Substitute="(?i).*new.*":"[\xF186]","(?i).*waxing.*":"[\xF186]","(?i).*quarter.*":"[\xF186]","(?i).*full.*":"[\xF186]","(?i).*waning.*":"[\xF186]","^$":"[\xF186]"
DynamicVariables=1

; ====================================================
; VISUAL INTERFACE
; ====================================================

[MeterBackground]
Meter=Shape
Shape=Ellipse 105,104,82,58 | StrokeWidth 0
Shape2=Ellipse 205,82,90,75 | StrokeWidth 0
Shape3=Ellipse 300,94,100,70 | StrokeWidth 0
Shape4=Ellipse 410,107,78,52 | StrokeWidth 0
Shape5=Combine Shape | Union Shape2 | Union Shape3 | Union Shape4 | Fill LinearGradient GlassGrad | StrokeColor 130,190,235,175 | StrokeWidth 1.2
GlassGrad=90 | 20,31,54,238 ; 0.0 | 37,52,78,232 ; 0.5 | 17,25,44,242 ; 1.0

[MeterIconDisplay]
Meter=String
MeasureName=MeasureWeatherIcon
X=160
Y=30
FontFace=#CustomFont#
FontColor=([MeasureIsDay] = 1 ? 205 : 0),([MeasureIsDay] = 1 ? 92 : 53),([MeasureIsDay] = 1 ? 74 : 102),255
FontSize=30
AntiAlias=1
Text=%1
ToolTipType=1
ToolTipTitle=📆 EXTENDED FORECAST SUMMARY
ToolTipText=[MeasureForecastRaw]
DynamicVariables=1

[MeterTempDisplay]
Meter=String
MeasureName=MeasureFormatTemp
X=210
Y=30
FontFace=#CustomFont#
FontColor=148, 118, 92,255
FontSize=24
FontWeight=700
AntiAlias=1
Text=%1
ToolTipType=1
ToolTipTitle=📆 EXTENDED FORECAST SUMMARY
ToolTipText=[MeasureForecastRaw]
DynamicVariables=1

[MeterWindDisplay]
Meter=String
MeasureName=MeasureWindDirectionArrow
MeasureName2=MeasureWindSpeed
X=240
Y=75
StringAlign=Center
FontFace=#CustomFont#
FontColor=1,87,155,255
FontSize=12
FontWeight=500
AntiAlias=1
; FIXED STANDARD WIND ICON AND KEEPS YOUR AUTOMATIC TEXT DIRECTIONS:
Text=" Wind [\xEF16] From %1 @ %2 m/s "
DynamicVariables=1

[MeterMoonDisplay]
Meter=String
MeasureName=MeasureMoonIcon
MeasureName2=MeasureMoonRaw
X=235
Y=100
StringAlign=Center
FontFace=#CustomFont#
FontColor=([MeasureIsDay] = 1 ? 69 : 121),([MeasureIsDay] = 1 ? 90 : 134),([MeasureIsDay] = 1 ? 100 : 203),255
FontSize=14
FontWeight=500
AntiAlias=1
W=(#SkinWidth# - 160)
ClipString=0
Text=%1  Phase: %2
;Text=    🌙 Phase %2
DynamicVariables=1




