[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=Weather Dusk Engine Master (Icon Code Variant)
Version=8.2
Information=Stable skin with split-measure wind logic and icon codes.

[Variables]
CacheFolder=#SETTINGSPATH#..\..\..\AppData\Local\Temp\WeatherCache
CustomFont=JetBrainsMono NF
SkinWidth=520
SkinHeight=90
ClickThrough=1
AlwaysOnTop=-2
DragMargins=0,0,0,0

; ====================================================
; DATA EXTRACTION ENGINE
; ====================================================

[MeasureJsonParent]
Measure=WebParser
Url=file://#CacheFolder#\weather_api_cache.json
RegExp=(?s)"current":\s*\{.*?"temperature_2m":\s*([\d\.-]+).*?"wind_speed_10m":\s*([\d\.-]+).*?"wind_direction_10m":\s*([\d\.-]+).*?"is_day":\s*(\d+).*?"weather_code":\s*(\d+)
UpdateRate=30

[MeasureTemp]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=1

[MeasureWindSpeed]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=2

[MeasureWindAngle]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=3

[MeasureIsDay]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=4

[MeasureConditionCode]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=5

[MeasureForecastRaw]
Measure=WebParser
Url=file://#CacheFolder#\weather_forecast_cache
RegExp=(?s)(.*)
UpdateRate=30

[MeasureMoonRaw]
Measure=WebParser
Url=file://#CacheFolder#\weather_moon_phase_cache
RegExp=(?s)(.*)
UpdateRate=30

[MeasureMoonIcon]
Measure=String
String=[MeasureMoonRaw]
RegExpSubstitute=1
; UNIVERSAL WEATHER ICON SECTOR MAP (Supported by all Nerd Fonts):
Substitute="^$":" ","(?i).*New Moon.*":"[\xE393]","(?i).*Waxing Crescent.*":"[\xE394]","(?i).*First Quarter.*":"[\xE397]","(?i).*Waxing Gibbous.*":"[\xE399]","(?i).*Full Moon.*":"[\xE39B]","(?i).*Waning Gibbous.*":"[\xE39C]","(?i).*Last Quarter.*":"[\xE39E]","(?i).*Waning Crescent.*":"[\xE3A0]"
DynamicVariables=1

; ====================================================
; TRANSLATORS & VALUE MAPS
; ====================================================

[MeasureFormatTemp]
Measure=String
String=[MeasureTemp]
RegExpSubstitute=1
Substitute="^(\d+)\.\d+$":"\1°C","^(\d+)$":"\1°C","^$":"--°C"
DynamicVariables=1

[MeasureIconKey]
Measure=Calc
Formula=([MeasureConditionCode] * 10 + [MeasureIsDay])
DynamicVariables=1

[MeasureWeatherIcon]
Measure=String
String=[MeasureIconKey]
RegExpSubstitute=1
Substitute="^0$":"[\xF186]","^1":"[\xF185]","^10":"[\xE37E]","^11":"[\xE21D]","^20":"[\xE37E]","^21":"[\xE21D]","^30":"[\xE312]","^31":"[\xE312]","^450":"[\xE313]","^451":"[\xE313]","^480":"[\xE313]","^481":"[\xE313]","^510":"[\xE239]","^511":"[\xE239]","^530":"[\xE239]","^531":"[\xE239]","^550":"[\xE239]","^551":"[\xE239]","^560":"[\xE239]","^561":"[\xE239]","^570":"[\xE239]","^571":"[\xE239]","^610":"[\xE239]","^611":"[\xE239]","^630":"[\xE239]","^631":"[\xE239]","^650":"[\xE239]","^651":"[\xE239]","^660":"[\xE239]","^661":"[\xE239]","^670":"[\xE239]","^671":"[\xE239]","^800":"[\xE239]","^801":"[\xE239]","^810":"[\xE239]","^811":"[\xE239]","^820":"[\xE239]","^821":"[\xE239]","^710":"[\xF2DC]","^711":"[\xF2DC]","^730":"[\xF2DC]","^731":"[\xF2DC]","^750":"[\xF2DC]","^751":"[\xF2DC]","^770":"[\xF2DC]","^771":"[\xF2DC]","^850":"[\xF2DC]","^851":"[\xF2DC]","^860":"[\xF2DC]","^861":"[\xF2DC]","^950":"[\xE322]","^951":"[\xE322]","^960":"[\xE322]","^961":"[\xE322]","^990":"[\xE322]","^991":"[\xE322]","^":"[\xF185]"
DynamicVariables=1

; --- SAFE DOUBLE-STAGE WIND TRANSLATION ENGINE ---

[MeasureWindIndex] 
Measure=Calc
Formula=Floor(([MeasureWindAngle] + 11.25) / 22.5) % 16
DynamicVariables=1

[MeasureWindDirectionString]
Measure=String
String=[MeasureWindIndex:]
RegExpSubstitute=1
; Double-digits listed first securely shields single digits from bleeding through
Substitute="^10$":"[\x2197] SW","^11$":"[\x2197] WSW","^12$":"[\x2192] W","^13$":"[\x2198] WNW","^14$":"[\x2198] NW","^15$":"[\x2198] NNW","^0$":"[\x2193] N","^1$":"[\x2199] NNE","^2$":"[\x2199] NE","^3$":"[\x2199] ENE","^4$":"[\x2190] E","^5$":"[\x2196] ESE","^6$":"[\x2196] SE","^7$":"[\x2196] SSE","^8$":"[\x2193] S","^9$":"[\x2197] SSW"
DynamicVariables=1

; ====================================================
; VISUAL INTERFACE
; ====================================================

[MeterBackground]
Meter=Shape
Shape=Ellipse 105,104,82,58 | StrokeWidth 0
Shape2=Ellipse 205,82,90,75 | StrokeWidth 0
Shape3=Ellipse 300,94,100,70 | StrokeWidth 0
Shape4=Ellipse 410,107,78,52 | StrokeWidth 0
Shape5=Combine Shape | Union Shape2 | Union Shape3 | Union Shape4 | Fill LinearGradient GlassGrad | StrokeColor 130,190,235,175 | StrokeWidth 1.2
GlassGrad=90 | 20,31,54,238 ; 0.0 | 37,52,78,232 ; 0.5 | 17,25,44,242 ; 1.0

[MeterIconDisplay]
Meter=String
MeasureName=MeasureWeatherIcon
X=160
Y=30
FontFace=#CustomFont#
FontColor=([MeasureIsDay] = 1 ? 205 : 0),([MeasureIsDay] = 1 ? 92 : 53),([MeasureIsDay] = 1 ? 74 : 102),255
FontSize=30
AntiAlias=1
Text=%1
ToolTipType=1
ToolTipTitle=📆 EXTENDED FORECAST SUMMARY
ToolTipText=[MeasureForecastRaw]
DynamicVariables=1

[MeterTempDisplay]
Meter=String
MeasureName=MeasureFormatTemp
X=212
Y=42
FontFace=#CustomFont#
FontColor=148, 118, 92,255
FontSize=24
FontWeight=700
AntiAlias=1
Text=%1
ToolTipType=1
ToolTipTitle=📆 EXTENDED FORECAST SUMMARY
ToolTipText=[MeasureForecastRaw]
DynamicVariables=1

[MeterWindDisplay]
Meter=String
MeasureName=MeasureWindDirectionString
MeasureName2=MeasureWindSpeed
X=240
Y=80
StringAlign=Center
FontFace=#CustomFont#
FontColor=1,87,155,255
FontSize=14
FontWeight=500
AntiAlias=1
; Renders the safe hexadecimal characters directly alongside your speed
Text=" Wind  From %1 @ %2 m/s "
DynamicVariables=1

[MeterMoonDisplay]
Meter=String
MeasureName=MeasureMoonIcon
MeasureName2=MeasureMoonRaw
X=235
Y=100
StringAlign=Center
FontFace=#CustomFont#
FontColor=([MeasureIsDay] = 1 ? 69 : 121),([MeasureIsDay] = 1 ? 90 : 134),([MeasureIsDay] = 1 ? 100 : 203),255
FontSize=14
FontWeight=500
AntiAlias=1
ClipString=1
W=(#SkinWidth# - 160)
; Renders the dynamic hex code icon right before the text phase string:
Text="%1 Phase: %2"
DynamicVariables=1
