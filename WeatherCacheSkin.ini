[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=Weather Dusk Engine Master (Icon Code Variant)
Version=8.2
Information=Stable skin with split-measure wind logic and icon codes.

[Variables]
CacheFolder=#SETTINGSPATH#..\..\..\AppData\Local\Temp\WeatherCache
CustomFont=JetBrainsMono NF
SkinWidth=520
SkinHeight=90
ClickThrough=1
AlwaysOnTop=-2
DragMargins=0,0,0,0

; ====================================================
; DATA EXTRACTION ENGINE
; ====================================================

[MeasureJsonParent]
Measure=WebParser
Url=file://#CacheFolder#\weather_api_cache.json
RegExp=(?s)"current":\s*\{.*?"temperature_2m":\s*([\d\.-]+).*?"wind_speed_10m":\s*([\d\.-]+).*?"wind_direction_10m":\s*([\d\.-]+).*?"is_day":\s*(\d+).*?"weather_code":\s*(\d+)
UpdateRate=30

[MeasureTemp]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=1

[MeasureWindSpeed]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=2

[MeasureWindAngle]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=3

[MeasureIsDay]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=4

[MeasureConditionCode]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=5

[MeasureForecastRaw]
Measure=WebParser
Url=file://#CacheFolder#\weather_forecast_cache
RegExp=(?s)(.*)
UpdateRate=30

[MeasureMoonRaw]
Measure=WebParser
Url=file://#CacheFolder#\weather_moon_phase_cache
RegExp=(?s)(.*)
UpdateRate=30

[MeasureMoonIcon]
Measure=String
String=[MeasureMoonRaw]
RegExpSubstitute=1
; UNIVERSAL WEATHER ICON SECTOR MAP (Supported by all Nerd Fonts):
Substitute="^$":" ","(?i).*New Moon.*":"","(?i).*Waxing Crescent.*":"","(?i).*First Quarter.*":"","(?i).*Waxing Gibbous.*":"","(?i).*Full Moon.*":"","(?i).*Waning Gibbous.*":"","(?i).*Last Quarter.*":"","(?i).*Waning Crescent.*":""
DynamicVariables=1

; ====================================================
; TRANSLATORS & VALUE MAPS
; ====================================================

[MeasureFormatTemp]
Measure=String
String=[MeasureTemp]
RegExpSubstitute=1
Substitute="^(\d+)\.\d+$":"\1°C","^(\d+)$":"\1°C","^$":"--°C"
DynamicVariables=1

[MeasureIconKey]
Measure=Calc
Formula=([MeasureConditionCode] * 10 + [MeasureIsDay])
DynamicVariables=1

[MeasureWeatherIcon]
Measure=String
String=[MeasureIconKey]
RegExpSubstitute=1
Substitute="^0$":"","^1$":"","^10$":"","^11$":"","^20$":"","^21$":"","^30$":"","^31$":"","^450$":"","^451$":"","^480$":"","^481$":"","^510$":"","^511$":"","^530$":"","^531$":"","^550$":"","^551$":"","^560$":"","^561$":"","^570$":"","^571$":"","^610$":"","^611$":"","^630$":"","^631$":"","^650$":"","^651$":"","^660$":"","^661$":"","^670$":"","^671$":"","^800$":"","^801$":"","^810$":"","^811$":"","^820$":"","^821$":"","^710$":"","^711$":"","^730$":"","^731$":"","^750$":"","^751$":"","^770$":"","^771$":"","^850$":"","^851$":"","^860$":"","^861$":"","^950$":"","^951$":"","^960$":"","^961$":"","^990$":"","^991$":"","^$":""
DynamicVariables=1

; --- SAFE DOUBLE-STAGE WIND TRANSLATION ENGINE ---

[MeasureWindIndex] 
Measure=Calc
Formula=Floor(([MeasureWindAngle] + 11.25) / 22.5) % 16
DynamicVariables=1

[MeasureWindDirectionString]
Measure=String
String=[MeasureWindIndex:]
RegExpSubstitute=1
; Double-digits listed first securely shields single digits from bleeding through
Substitute="^10$":"↗ SW","^11$":"↗ WSW","^12$":"→ W","^13$":"↘ WNW","^14$":"↘ NW","^15$":"↘ NNW","^0$":"↓ N","^1$":"↙ NNE","^2$":"↙ NE","^3$":"↙ ENE","^4$":"← E","^5$":"↖ ESE","^6$":"↖ SE","^7$":"↖ SSE","^8$":"↓ S","^9$":"↗ SSW"
DynamicVariables=1

; ====================================================
; VISUAL INTERFACE
; ====================================================

[MeterBackground]
Meter=Shape
Shape=Ellipse 105,104,82,58 | StrokeWidth 0
Shape2=Ellipse 205,82,90,75 | StrokeWidth 0
Shape3=Ellipse 300,94,100,70 | StrokeWidth 0
Shape4=Ellipse 410,107,78,52 | StrokeWidth 0
Shape5=Combine Shape | Union Shape2 | Union Shape3 | Union Shape4 | Fill LinearGradient GlassGrad | StrokeColor 130,190,235,175 | StrokeWidth 1.2
GlassGrad=90 | 20,31,54,238 ; 0.0 | 37,52,78,232 ; 0.5 | 17,25,44,242 ; 1.0

[MeterIconDisplay]
Meter=String
MeasureName=MeasureWeatherIcon
X=160
Y=30
FontFace=#CustomFont#
FontColor=([MeasureIsDay] = 1 ? 205 : 0),([MeasureIsDay] = 1 ? 92 : 53),([MeasureIsDay] = 1 ? 74 : 102),255
FontSize=30
AntiAlias=1
Text=%1
ToolTipType=1
ToolTipTitle=📆 EXTENDED FORECAST SUMMARY
ToolTipText=[MeasureForecastRaw]
DynamicVariables=1

[MeterTempDisplay]
Meter=String
MeasureName=MeasureFormatTemp
X=212
Y=42
FontFace=#CustomFont#
FontColor=148, 118, 92,255
FontSize=24
FontWeight=700
AntiAlias=1
Text=%1
ToolTipType=1
ToolTipTitle=📆 EXTENDED FORECAST SUMMARY
ToolTipText=[MeasureForecastRaw]
DynamicVariables=1

[MeterWindDisplay]
Meter=String
MeasureName=MeasureWindDirectionString
MeasureName2=MeasureWindSpeed
X=240
Y=80
StringAlign=Center
FontFace=#CustomFont#
FontColor=1,87,155,255
FontSize=14
FontWeight=500
AntiAlias=1
; Renders the safe hexadecimal characters directly alongside your speed
Text=" Wind  From %1 @ %2 m/s "
DynamicVariables=1

[MeterMoonDisplay]
Meter=String
MeasureName=MeasureMoonIcon
MeasureName2=MeasureMoonRaw
X=235
Y=100
StringAlign=Center
FontFace=#CustomFont#
FontColor=([MeasureIsDay] = 1 ? 69 : 121),([MeasureIsDay] = 1 ? 90 : 134),([MeasureIsDay] = 1 ? 100 : 203),255
FontSize=13
FontWeight=300
AntiAlias=1
ClipString=1
W=(#SkinWidth# - 160)
; Renders the dynamic hex code icon right before the text phase string:
Text="%1 Phase: %2"
DynamicVariables=1
