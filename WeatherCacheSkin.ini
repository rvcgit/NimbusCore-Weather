[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=Weather Dusk Engine Master
Version=8.1
Information=Stable skin with is_day-aware current weather icons.

[Variables]
CacheFolder=#SETTINGSPATH#..\..\..\AppData\Local\Temp\WeatherCache
CustomFont=JetBrainsMono NF
SkinWidth=520
SkinHeight=180

; ====================================================
; DATA EXTRACTION ENGINE
; ====================================================

[MeasureJsonParent]
Measure=WebParser
Url=file://#CacheFolder#\weather_api_cache.json
RegExp=(?s)"current":\s*\{.*?"temperature_2m":\s*([\d\.-]+).*?"wind_speed_10m":\s*([\d\.-]+).*?"wind_direction_10m":\s*([\d\.-]+).*?"is_day":\s*(\d+).*?"weather_code":\s*(\d+)
UpdateRate=180

[MeasureTemp]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=1

[MeasureWindSpeed]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=2

[MeasureWindAngle]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=3

; Capture 4 = is_day (1 daytime, 0 nighttime).
[MeasureIsDay]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=4

; Capture 5 = weather_code.
[MeasureConditionCode]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=5

[MeasureForecastRaw]
Measure=WebParser
Url=file://#CacheFolder#\weather_forecast_cache
RegExp=(?s)(.*)
UpdateRate=30

[MeasureMoonRaw]
Measure=WebParser
Url=file://#CacheFolder#\weather_moon_phase
RegExp=(?s)(.*)
UpdateRate=30

; ====================================================
; TRANSLATORS & VALUE MAPS
; ====================================================

[MeasureFormatTemp]
Measure=String
String=[MeasureTemp]
RegExpSubstitute=1
Substitute="^(\d+)\.\d+$":"\1°C","^(\d+)$":"\1°C","^$":"--°C"
DynamicVariables=1

; Combine weather_code and is_day; only clear/partly cloudy vary by day/night.
[MeasureIconKey]
Measure=Calc
Formula=([MeasureConditionCode] * 10 + [MeasureIsDay])
DynamicVariables=1

[MeasureWeatherIcon]
Measure=String
String=[MeasureIconKey]
RegExpSubstitute=1
Substitute="^0$":"","^1$":"","^10$":"","^11$":"","^20$":"","^21$":"","^30$":"","^31$":"","^450$":"","^451$":"","^480$":"","^481$":"","^510$":"","^511$":"","^530$":"","^531$":"","^550$":"","^551$":"","^610$":"","^611$":"","^630$":"","^631$":"","^650$":"","^651$":"","^950$":"","^951$":"","^960$":"","^961$":"","^990$":"","^991$":"","^$":""
DynamicVariables=1

[MeasureIconColor]
Measure=Calc
Formula=([MeasureIsDay] = 1 ? 139 : 0)
DynamicVariables=1

[MeasureWindDirectionArrow]
Measure=Calc
Formula=Floor(([MeasureWindAngle] + 11.25) / 22.5) % 16
DynamicVariables=1
Substitute="0":"↑ N","1":"↗ NNE","2":"↗ NE","3":"↗ ENE","4":"→ E","5":"↘ ESE","6":"↘ SE","7":"↘ SSE","8":"↓ S","9":"↙ SSW","10":"↙ SW","11":"↙ WSW","12":"← W","13":"↖ WNW","14":"↖ NW","15":"↖ NNW"

; ====================================================
; VISUAL INTERFACE
; ====================================================

[MeterBackground]
Meter=Shape
Shape=Ellipse 105,104,82,58 | StrokeWidth 0
Shape2=Ellipse 205,82,90,75 | StrokeWidth 0
Shape3=Ellipse 300,94,100,70 | StrokeWidth 0
Shape4=Ellipse 410,107,78,52 | StrokeWidth 0
Shape5=Combine Shape | Union Shape2 | Union Shape3 | Union Shape4 | Fill LinearGradient GlassGrad | StrokeColor 130,190,235,175 | StrokeWidth 1.2
GlassGrad=90 | 20,31,54,238 ; 0.0 | 37,52,78,232 ; 0.5 | 17,25,44,242 ; 1.0

[MeterIconDisplay]
Meter=String
MeasureName=MeasureWeatherIcon
X=136
Y=48
FontFace=#CustomFont#
FontColor=([MeasureIsDay] = 1 ? 205 : 0),([MeasureIsDay] = 1 ? 92 : 53),([MeasureIsDay] = 1 ? 74 : 102),255
FontSize=32
AntiAlias=1
Text=%1
ToolTipType=1
ToolTipTitle=📆 EXTENDED FORECAST SUMMARY
ToolTipText=[MeasureForecastRaw]
DynamicVariables=1

[MeterTempDisplay]
Meter=String
MeasureName=MeasureFormatTemp
X=190
Y=50
FontFace=#CustomFont#
FontColor=148, 118, 92,255
FontSize=24
FontWeight=700
AntiAlias=1
Text=%1
ToolTipType=1
ToolTipTitle=📆 EXTENDED FORECAST SUMMARY
ToolTipText=[MeasureForecastRaw]
DynamicVariables=1

[MeterWindDisplay]
Meter=String
MeasureName=MeasureWindDirectionArrow
MeasureName2=MeasureWindSpeed
X=240
Y=100
StringAlign=Center
FontFace=#CustomFont#
FontColor=1,87,155,255
FontSize=14
FontWeight=500
AntiAlias=1
Text= Wind      %1 @ %2 m/s
DynamicVariables=1

[MeterMoonDisplay]
Meter=String
MeasureName=MeasureMoonRaw
X=235
Y=120
StringAlign=Center
FontFace=#CustomFont#
FontColor=([MeasureIsDay] = 1 ? 69 : 121),([MeasureIsDay] = 1 ? 90 : 134),([MeasureIsDay] = 1 ? 100 : 203),255
FontSize=15
FontWeight=500
AntiAlias=1
ClipString=1
W=(#SkinWidth# - 160)
Text=    🌙 Phase is %1
DynamicVariables=1
