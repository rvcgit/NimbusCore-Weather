[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=Weather Dusk Engine Master
Version=8.1
Information=Stable skin with is_day-aware current weather icons.

[Variables]
CacheFolder=#SETTINGSPATH#..\..\..\AppData\Local\Temp\WeatherCache
CustomFont=JetBrainsMono NF
SkinWidth=520
SkinHeight=180

; ====================================================
; DATA EXTRACTION ENGINE
; ====================================================

[MeasureJsonParent]
Measure=WebParser
Url=file://#CacheFolder#\weather_api_cache.json
RegExp=(?s)"current":\s*\{.*?"temperature_2m":\s*([\d\.-]+).*?"wind_speed_10m":\s*([\d\.-]+).*?"wind_direction_10m":\s*([\d\.-]+).*?"is_day":\s*(\d+).*?"weather_code":\s*(\d+)
UpdateRate=180

[MeasureTemp]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=1

[MeasureWindSpeed]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=2

[MeasureWindAngle]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=3

; Capture 4 = is_day (1 daytime, 0 nighttime).
[MeasureIsDay]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=4

; Capture 5 = weather_code.
[MeasureConditionCode]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=5

[MeasureForecastRaw]
Measure=WebParser
Url=file://#CacheFolder#\weather_forecast_cache
RegExp=(?s)(.*)
UpdateRate=30

[MeasureMoonRaw]
Measure=WebParser
Url=file://#CacheFolder#\weather_moon_phase
RegExp=(?s)(.*)
UpdateRate=30

; ====================================================
; TRANSLATORS & VALUE MAPS
; ====================================================

[MeasureFormatTemp]
Measure=String
String=[MeasureTemp]
RegExpSubstitute=1
Substitute="^(\d+)\.\d+$":"\1°C","^(\d+)$":"\1°C","^$":"--°C"
DynamicVariables=1

; Combine weather_code and is_day; only clear/partly cloudy vary by day/night.
[MeasureIconKey]
Measure=Calc
Formula=([MeasureConditionCode] * 10 + [MeasureIsDay])
DynamicVariables=1

[MeasureWeatherIcon]
Measure=String
String=[MeasureIconKey]
RegExpSubstitute=1
Substitute="^0$":"","^1$":"","^10$":"","^11$":"","^20$":"","^21$":"","^30$":"","^31$":"","^450$":"","^451$":"","^480$":"","^481$":"","^510$":"","^511$":"","^530$":"","^531$":"","^550$":"","^551$":"","^610$":"","^611$":"","^630$":"","^631$":"","^650$":"","^651$":"","^950$":"","^951$":"","^960$":"","^961$":"","^990$":"","^991$":"","^$":""
DynamicVariables=1

[MeasureIconColor]
Measure=Calc
Formula=([MeasureIsDay] = 1 ? 139 : 0)
DynamicVariables=1

[MeasureWindDirectionArrow]
Measure=Calc
Formula=(([MeasureWindAngle] >= 337.5) || ([MeasureWindAngle] < 22.5) ? 1 : (([MeasureWindAngle] >= 22.5) && ([MeasureWindAngle] < 67.5) ? 2 : (([MeasureWindAngle] >= 67.5) && ([MeasureWindAngle] < 112.5) ? 3 : (([MeasureWindAngle] >= 112.5) && ([MeasureWindAngle] < 157.5) ? 4 : (([MeasureWindAngle] >= 157.5) && ([MeasureWindAngle] < 202.5) ? 5 : (([MeasureWindAngle] >= 202.5) && ([MeasureWindAngle] < 247.5) ? 6 : (([MeasureWindAngle] >= 247.5) && ([MeasureWindAngle] < 292.5) ? 7 : 8)))))))
RegExpSubstitute=1
Substitute="1":"↑ N","2":"↗ NE","3":"→ E","4":"↘ SE","5":"↓ S","6":"↙ SW","7":"← W","8":"↖ NW"
DynamicVariables=1

; ====================================================
; VISUAL INTERFACE
; ====================================================

[MeterBackground]
Meter=Shape
Shape=Ellipse 105,104,82,58 | StrokeWidth 0
Shape2=Ellipse 205,82,90,75 | StrokeWidth 0
Shape3=Ellipse 300,94,100,70 | StrokeWidth 0
Shape4=Ellipse 410,107,78,52 | StrokeWidth 0
Shape5=Combine Shape | Union Shape2 | Union Shape3 | Union Shape4 | Fill LinearGradient GlassGrad | StrokeColor 130,190,235,175 | StrokeWidth 1.2
GlassGrad=90 | 20,31,54,238 ; 0.0 | 37,52,78,232 ; 0.5 | 17,25,44,242 ; 1.0

[MeterIconDisplay]
Meter=String
MeasureName=MeasureWeatherIcon
X=102
Y=48
FontFace=#CustomFont#
FontColor=([MeasureIsDay] = 1 ? 205 : 0),([MeasureIsDay] = 1 ? 92 : 255),([MeasureIsDay] = 1 ? 74 : 255),255
FontSize=32
AntiAlias=1
Text=%1
ToolTipType=1
ToolTipTitle=📆 EXTENDED FORECAST SUMMARY
ToolTipText=[MeasureForecastRaw]
DynamicVariables=1

[MeterTempDisplay]
Meter=String
MeasureName=MeasureFormatTemp
X=166
Y=50
FontFace=#CustomFont#
FontColor=148, 118, 92,255
FontSize=24
FontWeight=700
AntiAlias=1
Text=%1
ToolTipType=1
ToolTipTitle=📆 EXTENDED FORECAST SUMMARY
ToolTipText=[MeasureForecastRaw]
DynamicVariables=1

[MeterWindDisplay]
Meter=String
MeasureName=MeasureWindDirectionArrow
MeasureName2=MeasureWindSpeed
X=220
Y=100
StringAlign=Center
FontFace=#CustomFont#
FontColor=34,139,34,255
FontSize=10
FontWeight=700
AntiAlias=1
Text= Wind      %1 @ %2 m/s
DynamicVariables=1

[MeterMoonDisplay]
Meter=String
MeasureName=MeasureMoonRaw
X=215
Y=120
StringAlign=Center
FontFace=#CustomFont#
FontColor=109,151,130,255
FontSize=10
FontWeight=700
AntiAlias=1
ClipString=1
W=(#SkinWidth# - 160)
Text=    🌙 Phase : %1
DynamicVariables=1
