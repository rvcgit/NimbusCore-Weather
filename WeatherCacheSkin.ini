[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=Weather Dusk Engine Master
Version=8.0

[Variables]
CacheFolder=#SETTINGSPATH#..\..\..\AppData\Local\Temp\WeatherCache
CustomFont=JetBrainsMono NF
; Increased overall skin boundaries to accommodate the 20% width expansion
SkinWidth=460
SkinHeight=170

; ====================================================
; DATA EXTRACTION ENGINE (WebParser File Hooks)
; ====================================================

[MeasureJsonParent]
Measure=WebParser
Url=file://#CacheFolder#\weather_api_cache.json
RegExp=(?s)"current":\s*\{.*?"temperature_2m":\s*([\d\.-]+).*?"wind_speed_10m":\s*([\d\.-]+).*?"wind_direction_10m":\s*([\d\.-]+).*?"is_day":\s*(\d+).*?"weather_code":\s*(\d+)
UpdateRate=180

[MeasureTemp]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=1

[MeasureWindSpeed]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=2

[MeasureWindAngle]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=3

[MeasureConditionCode]
Measure=WebParser
URL=[MeasureJsonParent]
StringIndex=5

[MeasureForecastRaw]
Measure=WebParser
Url=file://#CacheFolder#\weather_forecast_cache
RegExp=(?s)(.*)
UpdateRate=30

[MeasureMoonRaw]
Measure=WebParser
Url=file://#CacheFolder#\weather_moon_phase
RegExp=(?s)(.*)
UpdateRate=30

; ====================================================
; TRANSLATORS & VALUE MAPS
; ====================================================

[MeasureFormatTemp]
Measure=String
String=[MeasureTemp]
RegExpSubstitute=1
Substitute="^(\d+)\.\d+$":"\1°C","^(\d+)$":"\1°C","^$":"--°C"
DynamicVariables=1

[MeasureWeatherIcon]
Measure=String
String=[MeasureConditionCode]
RegExpSubstitute=1
Substitute="^0$":"","^1$":"","^2$":"","^3$":"","^45$":"","^48$":"","^51$":"","^53$":"","^55$":"","^61$":"","^63$":"","^65$":"","^95$":"","^96$":"","^99$":"","^$":""
DynamicVariables=1

[MeasureWindDirectionArrow]
Measure=Calc
Formula=(([MeasureWindAngle] >= 337.5) || ([MeasureWindAngle] < 22.5) ? 1 : (([MeasureWindAngle] >= 22.5) && ([MeasureWindAngle] < 67.5) ? 2 : (([MeasureWindAngle] >= 67.5) && ([MeasureWindAngle] < 112.5) ? 3 : (([MeasureWindAngle] >= 112.5) && ([MeasureWindAngle] < 157.5) ? 4 : (([MeasureWindAngle] >= 157.5) && ([MeasureWindAngle] < 202.5) ? 5 : (([MeasureWindAngle] >= 202.5) && ([MeasureWindAngle] < 247.5) ? 6 : (([MeasureWindAngle] >= 247.5) && ([MeasureWindAngle] < 292.5) ? 7 : 8)))))))
RegExpSubstitute=1
Substitute="1":"↑ N","2":"↗ NE","3":"→ E","4":"↘ SE","5":"↓ S","6":"↙ SW","7":"← W","8":"↖ NW"
DynamicVariables=1

; ====================================================
; VISUAL INTERFACE METERS
; ====================================================

; A beautiful 3-shape cloud layout expanded horizontally by 20% with synchronized deep overlap
[MeterBackground]
Meter=Shape
; 1. Left shape (Stretched horizontally to X-radius 75, Y-radius 60. Center pushed left to X=110)
Shape=Ellipse 110,96,72,60 | StrokeWidth 0
; 2. Center big shape (Stretched horizontally to X-radius 104, Y-radius 86. Center at X=215)
Shape2=Ellipse 215,82,104,86 | StrokeWidth 0
; 3. Right shape (Stretched horizontally to X-radius 65, Y-radius 54. Center pushed right to X=320)
Shape3=Ellipse 320,96,65,54 | StrokeWidth 0
; 4. Flatten the silhouette into one cohesive piece before rendering transparency
Shape4=Combine Shape | Union Shape2 | Union Shape3 | Fill LinearGradient GlassGrad | StrokeColor 180,230,180,25 | StrokeWidth 1
GlassGrad=90 | 12,14,24,145 ; 0.0 | 22,18,34,130 ; 1.0

[MeterIconDisplay]
Meter=String
MeasureName=MeasureWeatherIcon
X=102
Y=48
FontFace=#CustomFont#
FontColor=255,210,120,255
FontSize=32
AntiAlias=1
Text=%1
ToolTipType=1
ToolTipTitle=📆 EXTENDED FORECAST SUMMARY
ToolTipText=[MeasureForecastRaw]
DynamicVariables=1

[MeterTempDisplay]
Meter=String
MeasureName=MeasureFormatTemp
X=166
Y=50
FontFace=#CustomFont#
FontColor=255,210,120,255
FontSize=24
FontWeight=700
AntiAlias=1
Text=%1
ToolTipType=1
ToolTipTitle=📆 EXTENDED FORECAST SUMMARY
ToolTipText=[MeasureForecastRaw]
DynamicVariables=1

[MeterWindDisplay]
Meter=String
MeasureName=MeasureWindDirectionArrow
MeasureName2=MeasureWindSpeed
X=220
Y=100
StringAlign=Center
FontFace=#CustomFont#
FontColor=140,230,200,255
FontSize=10
FontWeight=700
AntiAlias=1
Text= Wind      %1 @ %2 m/s
DynamicVariables=1

[MeterMoonDisplay]
Meter=String
MeasureName=MeasureMoonRaw
; dynamic center align
X=215
Y=120
; specify to align
StringAlign=Center
FontFace=#CustomFont#
FontColor=195,180,250,255
FontSize=10
FontWeight=700
AntiAlias=1
ClipString=1
W=(#SkinWidth# - 160)
Text=    🌙 Phase : %1
DynamicVariables=1